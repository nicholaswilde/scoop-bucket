name: Update Manifest

on:
  repository_dispatch:
    types: [update-manifest]
  workflow_dispatch:
    inputs:
      manifest:
        description: 'Manifest name to update (e.g. tfa)'
        required: true
        type: string
      version:
        description: 'Version override (leave blank for latest release)'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: update-manifest
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Update manifest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MANIFEST_RAW: ${{ github.event.client_payload.manifest || github.event.client_payload.app || inputs.manifest }}
          VERSION_RAW: ${{ github.event.client_payload.version || inputs.version }}
        run: |
          set -euo pipefail

          MANIFEST="${MANIFEST_RAW%.json}"
          if [ -z "${MANIFEST}" ]; then
            echo "Error: manifest parameter is required"
            exit 1
          fi

          CMD_ARGS=("${MANIFEST}")
          if [ -n "${VERSION_RAW}" ]; then
            VERSION="${VERSION_RAW#v}"
            CMD_ARGS+=("--version-override" "${VERSION}")
          fi

          echo "Running updater for manifest: ${MANIFEST}"
          uv run python scripts/update_manifest.py "${CMD_ARGS[@]}"

      - name: Validate manifest
        env:
          MANIFEST_RAW: ${{ github.event.client_payload.manifest || github.event.client_payload.app || inputs.manifest }}
        run: |
          set -euo pipefail
          MANIFEST="${MANIFEST_RAW%.json}"
          TARGET_FILE="bucket/${MANIFEST}.json"

          if [ -f "${TARGET_FILE}" ]; then
            jq empty "${TARGET_FILE}"
          fi

      - name: Commit and push changes
        env:
          MANIFEST_RAW: ${{ github.event.client_payload.manifest || github.event.client_payload.app || inputs.manifest }}
          VERSION_RAW: ${{ github.event.client_payload.version || inputs.version }}
        run: |
          set -euo pipefail
          MANIFEST="${MANIFEST_RAW%.json}"
          TARGET_FILE="bucket/${MANIFEST}.json"

          if git diff --quiet "${TARGET_FILE}"; then
            echo "${TARGET_FILE} is already up to date. Nothing to commit."
            exit 0
          fi

          VERSION="${VERSION_RAW#v}"
          if [ -z "${VERSION}" ]; then
            VERSION=$(jq -r '.version' "${TARGET_FILE}")
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "${TARGET_FILE}"
          git commit -m "chore(manifest): bump ${MANIFEST} to ${VERSION}"
          git pull --rebase origin main
          git push origin main
