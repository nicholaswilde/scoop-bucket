name: Scheduled Manifest Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 0 * * 0' # Weekly at midnight on Sunday
  workflow_dispatch: # Allow manual triggering

jobs:
  test-manifests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.14

      - name: Run Python test suite
        run: uv run python -m unittest discover -s scripts

      - name: Validate Scoop Manifests
        run: |
          for manifest in bucket/*.json; do
            echo "Validating $manifest..."
            jq empty "$manifest"
          done
